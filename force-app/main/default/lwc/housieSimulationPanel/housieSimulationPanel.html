<template>
  <lightning-card title="Developer Simulation" icon-name="utility:bug">
    <div class="slds-p-around_medium">
      <lightning-combobox label="Scenario" value={scenario} options={options} onchange={onScenario}></lightning-combobox>
      <lightning-textarea label="Payload JSON" value={payload} onchange={onPayload}></lightning-textarea>
      <lightning-button class="slds-m-top_medium" variant="brand" label="Run simulation" onclick={run}></lightning-button>
      <template if:true={result}><p class="slds-m-top_medium">Operation {result.operationId}: {result.status}</p></template>
      <template if:true={error}><p class="slds-text-color_error">{error}</p></template>
    </div>
  </lightning-card>
</template>

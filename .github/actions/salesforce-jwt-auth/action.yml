name: Authenticate Salesforce Org (JWT)
description: Authenticate a Salesforce org using JWT credentials without embedding org-specific defaults.
inputs:
  jwt_key:
    description: JWT private key PEM
    required: true
  client_id:
    description: Connected App consumer key
    required: true
  username:
    description: Salesforce username
    required: true
  instance_url:
    description: Salesforce login or My Domain URL
    required: true
  alias:
    description: Local Salesforce CLI org alias
    required: true
  set_default:
    description: Set the authenticated org as the CLI default
    required: false
    default: "false"
outputs:
  alias:
    description: Alias used for the authenticated org
    value: ${{ inputs.alias }}
  instance_url:
    description: Instance URL used for authentication
    value: ${{ inputs.instance_url }}
runs:
  using: composite
  steps:
    - name: Authenticate with JWT
      shell: bash
      env:
        SF_JWT_KEY: ${{ inputs.jwt_key }}
        SF_CLIENT_ID: ${{ inputs.client_id }}
        SF_USERNAME: ${{ inputs.username }}
        SF_INSTANCE_URL: ${{ inputs.instance_url }}
        SF_ORG_ALIAS: ${{ inputs.alias }}
        SF_SET_DEFAULT: ${{ inputs.set_default }}
      run: |
        set -euo pipefail
        test -n "$SF_JWT_KEY" && test -n "$SF_CLIENT_ID" && test -n "$SF_USERNAME" && test -n "$SF_INSTANCE_URL"
        [[ "$SF_ORG_ALIAS" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid Salesforce CLI alias." >&2; exit 1; }
        [[ "$SF_SET_DEFAULT" == "true" || "$SF_SET_DEFAULT" == "false" ]] || { echo "set_default must be true or false." >&2; exit 1; }
        key_file="$RUNNER_TEMP/sf-jwt-$SF_ORG_ALIAS.key"
        printf '%s' "$SF_JWT_KEY" > "$key_file"
        chmod 600 "$key_file"
        args=(--client-id "$SF_CLIENT_ID" --jwt-key-file "$key_file" --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias "$SF_ORG_ALIAS")
        if [[ "$SF_SET_DEFAULT" == "true" ]]; then args+=(--set-default); fi
        sf org login jwt "${args[@]}"
        rm -f "$key_file"

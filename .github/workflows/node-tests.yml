name: Node package tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'src/**'
      - 'browser-agent/scripts/**'
      - 'browser-agent/core/**'
      - 'browser-agent/utilities/**'
      - 'browser-agent/package.json'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'src/**'
      - 'browser-agent/scripts/**'
      - 'browser-agent/core/**'
      - 'browser-agent/utilities/**'
      - 'browser-agent/package.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

name: Salesforce Issue Commands

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: salesforce-issue-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate and dispatch Salesforce AI iteration command
    if: >-
      github.event.issue.number == 11 &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/sf ') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate request and dispatch trusted workflow from main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const body = context.payload.comment.body || '';
            const lines = body.split(/\r?\n/).map(line => line.trim());

            const fail = async (message) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `<strong>Salesforce command rejected.</strong> ${message}\n\nSee the command formats in the issue description. No workflow was dispatched.`
              });
              core.setFailed(message);
            };

            try {
              if (context.payload.comment.author_association !== 'OWNER') {
                return await fail('Only repository owners may run Salesforce commands.');
              }

              const command = lines[0];
              if (!['/sf deploy', '/sf deploy-and-verify', '/sf restore', '/sf retrieve'].includes(command)) {
                return await fail('Supported commands are `/sf deploy`, `/sf deploy-and-verify`, `/sf restore`, and `/sf retrieve`.');
              }

              const isRetrieve = command === '/sf retrieve';
              const isDeploy = command === '/sf deploy' || command === '/sf deploy-and-verify';
              const allowed = isRetrieve ? new Set(['paths', 'create_pr', 'description']) : isDeploy ? new Set(['ref', 'paths', 'mode', 'tests', 'apex_test_classes', 'scenarios', 'description', 'confirm']) : new Set(['ref', 'paths', 'run_local_tests', 'confirm']);
              const fields = {};
              let listField = null;

              for (const line of lines.slice(1)) {
                if (!line) continue;
                const match = line.match(/^([a-z_]+):\s*(.*)$/);
                if (match) {
                  const key = match[1];
                  if (!allowed.has(key) || Object.hasOwn(fields, key)) {
                    throw new Error(`Unknown or duplicate field: ${key}`);
                  }
                  fields[key] = match[2];
                  listField = (['paths', 'apex_test_classes', 'scenarios'].includes(key)) ? key : null;
                  if (listField && fields[key] !== '') {
                    throw new Error(`Use a list under ${key}: with one "- value" per line.`);
                  }
                  continue;
                }
                if (line.startsWith('- ') && listField) {
                  fields[listField] += (fields[listField] ? '\n' : '') + line.slice(2).trim();
                  continue;
                }
                throw new Error('Unexpected command line. Use key: value fields and dash-prefixed list items.');
              }

              const ref = (fields.ref || '').trim();
              if (!isRetrieve && (!ref || ref.length > 200 || ref.startsWith('-') ||
                  ref.includes('..') || ref.includes('//') ||
                  !/^[A-Za-z0-9._/-]+$/.test(ref))) {
                throw new Error('ref must be an existing branch, tag, or commit SHA using safe Git ref characters.');
              }
              let workflowId;
              let inputs;

              const paths = (fields.paths || '').split('\n').map(x => x.trim()).filter(Boolean);
              if (isRetrieve) {
                if (paths.length > 25 || new Set(paths).size !== paths.length) throw new Error('Provide at most 25 unique retrieve paths.');
                const xmlPaths = paths.filter(path => path.endsWith('.xml'));
                if (xmlPaths.length > 1 || (xmlPaths.length && paths.length > 1)) throw new Error('Use either one retrieve manifest XML path or one or more component paths, not both.');
                for (const path of paths) {
                  if (path.length > 240 || path.includes('..') || path.includes('//') || path.endsWith('/') ||
                      !( /^force-app\/[A-Za-z0-9._/-]+$/.test(path) || /^manifest\/[A-Za-z0-9._/-]+\.xml$/.test(path))) {
                    throw new Error(`Invalid retrieve path: ${path}. Use force-app component paths or one manifest/*.xml file.`);
                  }
                }
                const createPr = (fields.create_pr || 'true').trim();
                if (!['true', 'false'].includes(createPr)) throw new Error('create_pr must be true or false.');
                const manifestPath = xmlPaths[0] || (paths.length === 0 ? 'manifest/package-retrieve.xml' : undefined);
                const selection = manifestPath ? { manifest: manifestPath } : { sourcePaths: paths };
                workflowId = '.github/workflows/sf-agent-retrieve.yml';
                inputs = {
                  source_ref: 'main',
                  inputs_json: JSON.stringify({
                    ...selection,
                    description: (fields.description || 'Issue-comment initiated metadata retrieve').slice(0, 300)
                  }),
                  confirmation: 'SYNC',
                  create_pr: createPr === 'true'
                };
              } else {
                if (!paths.length || paths.length > 25 || new Set(paths).size !== paths.length) {
                  throw new Error('Provide 1–25 unique paths under force-app/.');
                }
                for (const path of paths) {
                  if (path.length > 240 || !/^force-app\/[A-Za-z0-9._/-]+$/.test(path) ||
                      path.includes('..') || path.includes('//') || path.endsWith('/')) {
                    throw new Error(`Invalid metadata path: ${path}`);
                  }
                }
                // Resolve the ref through GitHub before dispatching; the downstream workflow
                // still checks out and validates the exact requested ref and paths.
                await github.rest.repos.getCommit({ owner, repo, ref });
              }

              if (isRetrieve) {
                // Retrieval inputs were prepared above.
              } else if (isDeploy) {
                const deploymentMode = (fields.mode || 'standard').trim();
                if (!['standard', 'fast'].includes(deploymentMode)) throw new Error('mode must be standard or fast.');
                const testMode = (fields.tests || 'none').trim();
                if (!['none', 'specified', 'local'].includes(testMode)) {
                  throw new Error('tests must be none, specified, or local.');
                }
                if (deploymentMode === 'fast' && testMode !== 'none') throw new Error('mode: fast requires tests: none.');
                const testClasses = (fields.apex_test_classes || '').split('\n').map(x => x.trim()).filter(Boolean);
                if (testMode === 'specified') {
                  if (!testClasses.length || testClasses.length > 30 ||
                      testClasses.some(x => !/^[A-Za-z][A-Za-z0-9_]*$/.test(x)) ||
                      new Set(testClasses).size !== testClasses.length) {
                    throw new Error('specified test mode requires 1–30 unique Apex test class names.');
                  }
                } else if (testClasses.length) {
                  throw new Error('apex_test_classes is only valid when tests: specified.');
                }
                if ((fields.confirm || '').trim() !== 'DEPLOY') {
                  throw new Error('Deployment requires the exact confirmation: confirm: DEPLOY.');
                }
                if (command === '/sf deploy') {
                  workflowId = '.github/workflows/sf-agent-run.yml';
                  inputs = {
                    operation: 'deploy',
                    source_ref: ref,
                    inputs_json: JSON.stringify({
                      sourcePaths: paths,
                      deploymentMode,
                      testMode,
                      apexTestClasses: testClasses
                    }),
                    confirmation: 'DEPLOY'
                  };
                } else {
                  workflowId = '.github/workflows/salesforce-deploy-and-verify.yml';
                  inputs = {
                    source_ref: ref,
                    source_paths: paths.join('\n'),
                    deployment_mode: deploymentMode,
                    test_mode: testMode,
                    apex_test_classes: testClasses.join('\n'),
                    confirm_deployment: 'DEPLOY'
                  };
                  const scenarios = (fields.scenarios || '').split('\n').map(x => x.trim()).filter(Boolean);
                  if (!scenarios.length || scenarios.length > 10 || new Set(scenarios).size !== scenarios.length || scenarios.some(x => !x.startsWith('browser-agent/scenarios/') || !x.endsWith('.spec.ts') || x.includes('..') || x.includes('//'))) throw new Error('Provide 1–10 unique scenario paths under browser-agent/scenarios/*.spec.ts.');
                  inputs.scenarios_json = JSON.stringify(scenarios);
                  inputs.run_description = (fields.description || 'AI-requested deploy and browser verification').slice(0, 300);
                }
              } else {
                const runTests = (fields.run_local_tests || 'false').trim();
                if (!['true', 'false'].includes(runTests)) {
                  throw new Error('run_local_tests must be true or false.');
                }
                if ((fields.confirm || '').trim() !== 'RESTORE') {
                  throw new Error('Restore requires the exact confirmation: confirm: RESTORE.');
                }
                workflowId = '.github/workflows/sf-agent-run.yml';
                inputs = {
                  operation: 'restore',
                  source_ref: ref,
                  inputs_json: JSON.stringify({
                    sourcePaths: paths,
                    runLocalTests: runTests === 'true'
                  }),
                  confirmation: 'RESTORE'
                };
              }

              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: workflowId, ref: 'main', inputs
              });

              const label = isRetrieve ? 'Salesforce metadata retrieve' : command === '/sf deploy-and-verify' ? 'AI deploy and browser verification' : command === '/sf deploy' ? 'AI iteration deploy' : 'AI iteration restore';
              const workflowUrl = `https://github.com/${owner}/${repo}/actions/workflows/${workflowId}`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: isRetrieve ? `<strong>${label} dispatched.</strong>\n\n- Retrieve selection: ${paths.length ? paths.map(p => `\`${p}\``).join(', ') : '`manifest/package-retrieve.xml` (default)'}\n- Create pull request: ${fields.create_pr || 'true'}\n- Workflow definition: \`main\`\n\n[Open the workflow runs](${workflowUrl}).` : `<strong>${label} dispatched.</strong>\n\n- Requested ref: \`${ref}\`\n- Selected paths:\n${paths.map(p => `  - \`${p}\``).join('\n')}\n- Workflow definition: \`main\`\n\n[Open the workflow runs](${workflowUrl}). Deployment mode: ${isDeploy ? (fields.mode || 'standard') : 'n/a'}.`
              });
            } catch (error) {
              const message = String(error.message || error).replace(/[\r\n]+/g, ' ').slice(0, 500);
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `<strong>Salesforce command rejected.</strong> ${message}\n\nNo successful dispatch was confirmed. Check the command format and the referenced Git ref.`
              });
              core.setFailed(message);
            }

name: Salesforce Issue Commands

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: salesforce-issue-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate and dispatch Salesforce command
    if: >-
      github.event.issue.number == 11 &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/sf ') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted command handler
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and dispatch command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: node src/handle-issue-command.js

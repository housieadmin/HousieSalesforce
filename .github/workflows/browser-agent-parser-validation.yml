name: Housie Browser Agent Parser Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/browser-agent.yml'
      - '.github/workflows/browser-agent-parser-validation.yml'
      - 'browser-agent/scripts/**'

permissions:
  contents: read

jobs:
  validate-parser:
    name: Validate browser-agent request parser
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser regression tests
        run: node --test browser-agent/scripts/parse-request.test.mjs

name: Salesforce AI Iteration Restore

on:
  workflow_dispatch:
    inputs:
      restore_ref:
        description: Known-good branch, tag, or commit SHA containing the version to restore
        required: true
        type: string
      source_paths:
        description: "Comma-separated or newline-separated paths under force-app/"
        required: true
        type: string
      run_local_tests:
        description: Run all local Apex tests after restoring metadata
        required: true
        type: boolean
        default: false
      confirm_restore:
        description: Type RESTORE to authorize recovery deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: salesforce-development-deployment
  cancel-in-progress: false

jobs:
  restore:
    name: Restore selected metadata from a known-good Git ref
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RESTORE_REF: ${{ inputs.restore_ref }}
      SOURCE_PATHS_INPUT: ${{ inputs.source_paths }}
      RUN_LOCAL_TESTS: ${{ inputs.run_local_tests }}
      CONFIRM_RESTORE: ${{ inputs.confirm_restore }}
      SF_TARGET_ORG_ALIAS: housie-dev
    steps:
      - name: Check out known-good Git ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.restore_ref }}
          fetch-depth: 0
      - name: Check out trusted automation code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: .automation-runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate to Developer Edition
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: node .automation-runtime/packages/sf-augment/bin/login-with-jwt.js housie-dev
      - name: Restore selected metadata and optionally run local tests
        run: node .automation-runtime/src/salesforce-deploy.mjs restore

name: sf-agent validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'sf-agent/**'
      - '.project/sf-agent.config.yml'
      - '.github/workflows/sf-agent-validation.yml'
      - '.github/workflows/sf-agent-run.yml'
      - '.github/workflows/salesforce-issue-commands.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sf-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Type-check core, engines, plugins and scenarios
        run: npm run typecheck
      - name: Run unit and browser smoke tests
        run: npm test
      - name: Build importable packages
        run: npm run build
      - name: Lint execution workflows
        working-directory: .
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/sf-agent-validation.yml .github/workflows/sf-agent-run.yml .github/workflows/salesforce-issue-commands.yml

name: Housie Browser Agent

on:
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      source_ref: { required: true, type: string }
      scenarios_json: { required: true, type: string }
      run_description: { required: false, type: string, default: Combined deploy and browser verification }
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/browser-agent.yml'
      - 'browser-agent/scripts/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: browser-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Reusable workflow calls inherit the caller's github.event_name; inputs.source_ref is the reliable discriminator.
  browser-agent:
    name: Browser agent validation
    if: >-
      github.event_name == 'pull_request' ||
      inputs.source_ref != '' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 9 &&
       github.event.issue.pull_request == null &&
       startsWith(github.event.comment.body, '/browser-agent run') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request for parser validation
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
      - name: Set up Node.js for parser validation
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser regression tests
        if: github.event_name == 'pull_request'
        run: node --test browser-agent/scripts/*.test.mjs

      - name: Check out trusted browser-agent runtime and tooling
        if: github.event_name == 'issue_comment' || inputs.source_ref != ''
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: .browser-agent-runtime

      - name: Parse and validate request
        if: github.event_name == 'issue_comment'
        id: request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          node .browser-agent-runtime/browser-agent/scripts/parse-request.mjs
          cp .browser-agent-runtime/browser-agent/scripts/extract-frontdoor-url.mjs "$RUNNER_TEMP/extract-frontdoor-url.mjs"

      - name: Prepare reusable workflow request
        if: inputs.source_ref != ''
        id: reusable-request
        env:
          REQUESTED_REF: ${{ inputs.source_ref }}
          SCENARIOS_JSON: ${{ inputs.scenarios_json }}
          RUN_DESCRIPTION: ${{ inputs.run_description }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"); const a=JSON.parse(process.env.SCENARIOS_JSON); if(!Array.isArray(a)||a.length<1||a.length>10||new Set(a).size!==a.length||a.some(x=>typeof x!=="string"||!x.startsWith("browser-agent/scenarios/")||!x.endsWith(".spec.ts")||x.includes("..")||x.includes("//"))) throw Error("Invalid scenario list"); if(!process.env.REQUESTED_REF||process.env.REQUESTED_REF.length>200) throw Error("Invalid source ref"); const nl=String.fromCharCode(10); fs.appendFileSync(process.env.GITHUB_OUTPUT,["ref="+process.env.REQUESTED_REF,"description="+(process.env.RUN_DESCRIPTION||"").slice(0,300),"scenarios="+JSON.stringify(a)].join(nl)+nl);'
          cp .browser-agent-runtime/browser-agent/scripts/extract-frontdoor-url.mjs "$RUNNER_TEMP/extract-frontdoor-url.mjs"

      - name: Check out requested ref
        if: ${{ github.event_name == 'issue_comment' || inputs.source_ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref || steps.reusable-request.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: .browser-agent-source

      - name: Stage requested scenarios into trusted runtime
        if: ${{ github.event_name == 'issue_comment' || inputs.source_ref != '' }}
        env:
          SCENARIOS_JSON: ${{ steps.request.outputs.scenarios || steps.reusable-request.outputs.scenarios }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sourceRoot = path.resolve('.browser-agent-source/browser-agent/scenarios');
          const runtimeRoot = path.resolve('.browser-agent-runtime/browser-agent/scenarios');
          const files = JSON.parse(process.env.SCENARIOS_JSON || '[]');
          if (!Array.isArray(files) || files.length < 1 || files.length > 10) throw new Error('Invalid scenario list');
          for (const file of files) {
            if (typeof file !== 'string' || !/^[A-Za-z0-9._\/-]+$/.test(file) || !file.startsWith('browser-agent/scenarios/') || !file.endsWith('.spec.ts') || file.includes('..') || file.includes('//')) throw new Error('Invalid scenario path: ' + file);
            const source = path.resolve('.browser-agent-source', file);
            const real = fs.realpathSync(source);
            const rel = path.relative(sourceRoot, real);
            if (!rel || rel.startsWith('..' + path.sep) || path.isAbsolute(rel) || !fs.lstatSync(source).isFile() || fs.lstatSync(source).isSymbolicLink()) throw new Error('Scenario must be a regular file inside browser-agent/scenarios: ' + file);
            const target = path.join(runtimeRoot, rel);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(real, target);
          }
          NODE
          # Stage only reusable browser utility modules; never import arbitrary source-branch code
          # into the trusted runtime. Keep the path and extension allowlist deliberately narrow.
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sourceRoot = path.resolve('.browser-agent-source/browser-agent/utilities');
          const runtimeRoot = path.resolve('.browser-agent-runtime/browser-agent/utilities');
          if (!fs.existsSync(sourceRoot)) process.exit(0);
          const walk = dir => fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
            const full = path.join(dir, entry.name);
            if (entry.isSymbolicLink()) throw new Error('Symlinks are not allowed in shared browser utilities: ' + full);
            if (entry.isDirectory()) return walk(full);
            if (!entry.isFile() || !entry.name.endsWith('.ts')) throw new Error('Only TypeScript utility modules are allowed: ' + full);
            return [full];
          });
          for (const source of walk(sourceRoot)) {
            const real = fs.realpathSync(source);
            const rel = path.relative(sourceRoot, real);
            if (!rel || rel.startsWith('..' + path.sep) || path.isAbsolute(rel)) throw new Error('Utility escaped source root: ' + source);
            const target = path.join(runtimeRoot, rel);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(real, target);
          }
          NODE

      - name: Set up Node.js
        if: ${{ github.event_name == 'issue_comment' || inputs.source_ref != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: ${{ github.event_name == 'issue_comment' || inputs.source_ref != '' }}
        working-directory: .browser-agent-runtime/browser-agent
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        if: ${{ github.event_name == 'issue_comment' || inputs.source_ref != '' }}
        working-directory: .browser-agent-runtime/browser-agent
        run: npx playwright install --with-deps chromium

      - name: Authenticate to Salesforce
        if: ${{ github.event_name == 'issue_comment' || inputs.source_ref != '' }}
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SF_JWT_KEY" && test -n "$SF_CLIENT_ID" && test -n "$SF_USERNAME" && test -n "$SF_INSTANCE_URL"
          npm install --global @salesforce/cli
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/browser-agent-server.key"
          chmod 600 "$RUNNER_TEMP/browser-agent-server.key"
          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file "$RUNNER_TEMP/browser-agent-server.key" --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias housie-browser-agent --set-default >/dev/null
          sf org open --url-only --target-org housie-browser-agent --json > "$RUNNER_TEMP/browser-agent-frontdoor.json"
          FRONTDOOR_URL="$(node "$RUNNER_TEMP/extract-frontdoor-url.mjs" "$RUNNER_TEMP/browser-agent-frontdoor.json")"
          echo "::add-mask::$FRONTDOOR_URL"
          echo "HOUSIE_START_URL=$FRONTDOOR_URL" >> "$GITHUB_ENV"
          echo "SF_INSTANCE_URL=$SF_INSTANCE_URL" >> "$GITHUB_ENV"

      - name: Enable Apex debug logging for the browser transaction
        if: ${{ github.event_name == 'issue_comment' || inputs.source_ref != '' }}
        continue-on-error: true
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          echo "APEX_DEBUG_ENABLED=false" >> "$GITHUB_ENV"
          user_json="$(sf data query --query "SELECT Id FROM User WHERE Username = '$SF_USERNAME' LIMIT 1" --target-org housie-browser-agent --json)"
          user_id="$(jq -r '(.result | if type == "array" then .[0].Id else .records[0].Id end) // empty' <<< "$user_json")"
          if [[ -z "$user_id" ]]; then
            echo "Could not resolve the authenticated Salesforce user ID for Apex tracing." >&2
            exit 1
          fi

          trace_json="$(sf apex trace list --target-org housie-browser-agent --json)"
          trace_id="$(jq -r --arg user "$user_id" '(.result | if type == "array" then . else (.records // []) end)[]? | select((.tracedEntityId // .TracedEntityId) == $user) | (.id // .Id)' <<< "$trace_json" | head -n 1)"
          if [[ -n "$trace_id" ]]; then
            sf apex trace delete --trace-flag-id "$trace_id" --target-org housie-browser-agent --json >/dev/null
          fi
          sf apex trace create --traced-entity-id "$user_id" --debug-level SFDC_DevConsole --duration 45 --target-org housie-browser-agent --json >/dev/null
          echo "APEX_DEBUG_ENABLED=true" >> "$GITHUB_ENV"
          echo "Apex debug trace enabled for the browser integration user."

      - name: Execute selected scenarios
        if: ${{ github.event_name == 'issue_comment' || inputs.source_ref != '' }}
        id: run
        working-directory: .browser-agent-runtime/browser-agent
        env:
          SCENARIOS_JSON: ${{ steps.request.outputs.scenarios || steps.reusable-request.outputs.scenarios }}
          RUN_DESCRIPTION: ${{ steps.request.outputs.description || steps.reusable-request.outputs.description }}
          REQUESTED_REF: ${{ steps.request.outputs.ref || steps.reusable-request.outputs.ref }}
          BROWSER_AGENT_ARTIFACT_DIR: artifacts/${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set +e
          mkdir -p "$BROWSER_AGENT_ARTIFACT_DIR"
          export BROWSER_AGENT_ARTIFACT_DIR
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const files = JSON.parse(process.env.SCENARIOS_JSON || '[]');
          const root = path.resolve('scenarios') + path.sep;
          for (const file of files) {
            const resolved = path.resolve('scenarios', path.relative('browser-agent/scenarios', file));
            if (!resolved.startsWith(root) || !fs.existsSync(resolved) || !fs.statSync(resolved).isFile()) {
              console.error('Scenario missing or outside scenario directory: ' + file);
              process.exit(2);
            }
          }
          fs.writeFileSync(path.join(process.env.BROWSER_AGENT_ARTIFACT_DIR, 'run-metadata.json'), JSON.stringify({
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            sourceRef: process.env.REQUESTED_REF,
            sourceCommit: require('node:child_process').execFileSync('git', ['-C', '../../.browser-agent-source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            scenarios: files,
            description: process.env.RUN_DESCRIPTION
          }, null, 2));
          const args = ['node_modules/@playwright/test/cli.js', 'test', ...files.map(f => path.relative(process.cwd(), path.resolve('scenarios', path.relative('browser-agent/scenarios', f))))];
          const result = spawnSync(process.execPath, args, { stdio: 'inherit', env: process.env });
          process.exit(result.status === null ? 1 : result.status);
          NODE
          TEST_EXIT=$?
          export TEST_EXIT
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.BROWSER_AGENT_ARTIFACT_DIR;
          let report = null;
          try { report = JSON.parse(fs.readFileSync(path.join(dir, 'playwright-report.json'), 'utf8')); } catch {}
          const flatten = (suites, out = []) => {
            for (const suite of suites || []) {
              for (const spec of suite.specs || []) for (const test of spec.tests || []) out.push({ title: spec.title, file: spec.file, results: test.results || [] });
              flatten(suite.suites, out);
            }
            return out;
          };
          const tests = flatten(report && report.suites);
          const failed = tests.filter(t => t.results.some(r => ['failed', 'timedOut'].includes(r.status)));
          const passed = tests.filter(t => t.results.some(r => r.status === 'passed'));
          fs.writeFileSync(path.join(dir, 'summary.md'), [
            '# Browser execution summary', '',
            '- Tests observed: ' + tests.length,
            '- Passed: ' + passed.length,
            '- Failed/timed out: ' + failed.length,
            '- Playwright exit code: ' + process.env.TEST_EXIT,
            '', 'This report records browser observations; it does not certify feature completeness.', ''
          ].join('\n'));
          fs.writeFileSync(path.join(dir, 'execution-summary.json'), JSON.stringify({ total: tests.length, passed: passed.length, failed: failed.length, failedTests: failed }, null, 2));
          NODE
          exit "$TEST_EXIT"

      - name: Collect Apex debug logs
        if: always() && (github.event_name == 'issue_comment' || inputs.source_ref != '') && env.APEX_DEBUG_ENABLED == 'true'
        working-directory: .browser-agent-runtime/browser-agent
        env:
          BROWSER_AGENT_ARTIFACT_DIR: artifacts/${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set +e
          log_dir="$BROWSER_AGENT_ARTIFACT_DIR/apex-logs"
          mkdir -p "$log_dir"
          sf apex log get --number 20 --output-dir "$log_dir" --target-org housie-browser-agent > "$log_dir/fetch-output.txt" 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "Apex log retrieval failed with exit code $status" >> "$log_dir/collection-error.txt"
          fi
          count="$(find "$log_dir" -type f -name '*.log' | wc -l | tr -d ' ')"
          echo "Apex debug logs collected: $count"
          printf '%s\n' "Apex debug logs collected: $count" >> "$BROWSER_AGENT_ARTIFACT_DIR/summary.md"

      - name: Upload execution artifacts
        if: always() && (github.event_name == 'issue_comment' || inputs.source_ref != '')
        uses: actions/upload-artifact@v4
        with:
          name: housie-browser-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: .browser-agent-runtime/browser-agent/artifacts/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment with execution result
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = [
              'Browser execution finished.',
              '- Workflow run: ' + url,
              '- Requested ref: ${{ steps.request.outputs.ref || steps.reusable-request.outputs.ref }}',
              '- Scenarios: ${{ steps.request.outputs.scenarios || steps.reusable-request.outputs.scenarios }}',
              '- Evidence: download the artifact from the workflow run.'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 9, body });

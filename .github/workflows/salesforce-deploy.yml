name: Salesforce Controlled Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: Metadata group to deploy
        required: true
        type: choice
        default: application
        options: [application, org-setup, experience]
      confirm_deployment:
        description: Type DEPLOY to authorize the deployment request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: salesforce-development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved release to Developer Edition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    env:
      DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope }}
      CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment }}
      SF_TARGET_ORG_ALIAS: housie-dev
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate to Developer Edition
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: node packages/sf-augment/bin/login-with-jwt.js housie-dev
      - name: Validate, deploy and verify release
        run: node src/validate-release-metadata.js

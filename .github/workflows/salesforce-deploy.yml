name: Salesforce Controlled Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: Metadata group to deploy
        required: true
        type: choice
        default: application
        options:
          - application
          - org-setup
          - experience
      confirm_deployment:
        description: Type DEPLOY to authorize the deployment request
        required: true
        type: string

permissions:
  contents: read

env:
  # Override with a repository variable when using a different Salesforce org alias.
  SF_ORG_ALIAS: ${{ vars.SF_ORG_ALIAS || 'housie-dev' }}

concurrency:
  group: salesforce-development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved release to Developer Edition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    env:
      DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope }}
    steps:
      - name: Verify explicit deployment confirmation
        env:
          CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_DEPLOYMENT" != "DEPLOY" ]]; then
            echo "Deployment not authorized. Type DEPLOY in the confirmation input." >&2
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_SCOPE" in
            application) path="manifest/package.xml" ;;
            org-setup) path="manifest/package-org-setup.xml" ;;
            experience) path="manifest/package-experience.xml" ;;
            *) echo "Unsupported deployment scope: $DEPLOYMENT_SCOPE" >&2; exit 1 ;;
          esac
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Install Salesforce CLI
        uses: ./.github/actions/setup-salesforce-cli

      - name: Authenticate to Developer Edition
        uses: ./.github/actions/salesforce-jwt-auth
        with:
          jwt_key: ${{ secrets.SF_JWT_KEY }}
          client_id: ${{ secrets.SF_CLIENT_ID }}
          username: ${{ secrets.SF_USERNAME }}
          instance_url: ${{ vars.SF_INSTANCE_URL }}
          alias: ${{ vars.SF_ORG_ALIAS || 'housie-dev' }}

      - name: Validate selected release (dry run)
        run: sf project deploy start --dry-run --manifest "${{ steps.manifest.outputs.path }}" --target-org "$SF_ORG_ALIAS" --test-level NoTestRun --wait 60

      - name: Run local Apex tests before deployment
        run: sf apex run test --target-org "$SF_ORG_ALIAS" --test-level RunLocalTests --result-format human --wait 60

      - name: Deploy selected metadata
        run: sf project deploy start --manifest "${{ steps.manifest.outputs.path }}" --target-org "$SF_ORG_ALIAS" --test-level NoTestRun --wait 60

      - name: Run local Apex tests after deployment
        run: sf apex run test --target-org "$SF_ORG_ALIAS" --test-level RunLocalTests --result-format human --wait 60

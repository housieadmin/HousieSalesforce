name: Salesforce AI Iteration Deploy

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Feature branch or commit SHA to deploy (must already be pushed)
        required: true
        type: string
      source_paths:
        description: "Comma-separated or newline-separated paths under force-app/"
        required: true
        type: string
      deployment_mode:
        description: Standard validates; fast skips dry-run and Apex tests
        required: true
        type: choice
        default: standard
        options: [standard, fast]
      test_mode:
        description: Apex tests to run after deployment
        required: true
        type: choice
        default: none
        options: [none, specified, local]
      apex_test_classes:
        description: Required for specified mode; one Apex test class name per line
        required: false
        type: string
      confirm_deployment:
        description: Type DEPLOY to authorize deployment
        required: true
        type: string
  workflow_call:
    inputs:
      source_ref: { required: true, type: string }
      source_paths: { required: true, type: string }
      deployment_mode: { required: false, type: string, default: standard }
      test_mode: { required: false, type: string, default: none }
      apex_test_classes: { required: false, type: string }
      confirm_deployment: { required: true, type: string }

permissions:
  contents: read

concurrency:
  group: salesforce-development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected feature-branch metadata
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_PATHS_INPUT: ${{ inputs.source_paths }}
      DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'standard' }}
      TEST_MODE: ${{ inputs.test_mode || 'none' }}
      APEX_TEST_CLASSES_INPUT: ${{ inputs.apex_test_classes }}
      CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment }}
      SF_TARGET_ORG_ALIAS: housie-dev
    steps:
      - name: Check out selected feature branch or commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Check out trusted automation code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: .automation-runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate to Developer Edition
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: node .automation-runtime/packages/sf-augment/bin/login-with-jwt.js housie-dev
      - name: Deploy selected metadata and run configured tests
        run: node .automation-runtime/src/deploy-feature-metadata.js

name: Salesforce Org Metadata Sync

on:
  workflow_dispatch:
    inputs:
      confirm_sync:
        description: Type SYNC to retrieve metadata from the Developer Edition org
        required: true
        type: string
      retrieve_paths:
        description: Optional component paths under force-app, one per line
        required: false
        type: string
      retrieve_manifest:
        description: Manifest XML under manifest, used when no component paths are supplied
        required: false
        type: string
        default: manifest/package-retrieve.xml
      create_pr:
        description: Create a pull request with retrieved changes; otherwise upload an artifact
        required: false
        type: boolean
        default: true
      run_description:
        description: Short reason for this retrieval
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: salesforce-org-sync
  cancel-in-progress: false

jobs:
  retrieve:
    name: Retrieve selected metadata from Salesforce org
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CONFIRM_SYNC: ${{ inputs.confirm_sync }}
      RETRIEVE_PATHS_INPUT: ${{ inputs.retrieve_paths }}
      RETRIEVE_MANIFEST: ${{ inputs.retrieve_manifest }}
      CREATE_PR: ${{ inputs.create_pr }}
      RUN_DESCRIPTION: ${{ inputs.run_description }}
      SF_TARGET_ORG_ALIAS: housie-dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate to Developer Edition
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: node packages/sf-augment/bin/login-with-jwt.js housie-dev
      - name: Retrieve selected metadata and open PR when requested
        id: retrieve
        run: node src/sync-org-metadata.js
      - name: Upload retrieved metadata when PR creation is disabled
        if: ${{ !inputs.create_pr && steps.retrieve.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-org-retrieve-${{ github.run_id }}
          path: force-app/
          if-no-files-found: error
          retention-days: 14

name: Salesforce Org Metadata Sync

on:
  workflow_dispatch:
    inputs:
      confirm_sync:
        description: Type SYNC to retrieve metadata and open a pull request
        required: true
        type: string
      retrieve_manifest:
        description: Retrieve manifest path (must be under manifest/)
        required: true
        type: string
        default: manifest/package-retrieve.xml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: salesforce-org-sync
  cancel-in-progress: false

jobs:
  retrieve-and-open-pr:
    name: Retrieve allowlisted metadata and create PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicit sync confirmation
        env:
          CONFIRM_SYNC: ${{ inputs.confirm_sync }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_SYNC" != "SYNC" ]]; then
            echo "Org sync not authorized. Type SYNC in the confirmation input." >&2
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate retrieve manifest path
        env:
          RETRIEVE_MANIFEST: ${{ inputs.retrieve_manifest }}
        run: |
          set -euo pipefail
          if [[ ! "$RETRIEVE_MANIFEST" =~ ^manifest/[A-Za-z0-9._/-]+\.xml$ || "$RETRIEVE_MANIFEST" == *".."* ]]; then
            echo "Retrieve manifest must be a safe path under manifest/ ending in .xml" >&2
            exit 1
          fi
          test -f "$RETRIEVE_MANIFEST"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Developer Edition
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: |
          set -euo pipefail
          test -n "$SF_JWT_KEY" && test -n "$SF_CLIENT_ID" && test -n "$SF_USERNAME" && test -n "$SF_INSTANCE_URL"
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          chmod 600 "$RUNNER_TEMP/server.key"
          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file "$RUNNER_TEMP/server.key" --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias housie-dev

      - name: Retrieve selected metadata from org
        env:
          RETRIEVE_MANIFEST: ${{ inputs.retrieve_manifest }}
        run: sf project retrieve start --manifest "$RETRIEVE_MANIFEST" --target-org housie-dev --wait 60

      - name: Create branch and pull request when changes exist
        env:
          GH_TOKEN: ${{ github.token }}
          RETRIEVE_MANIFEST: ${{ inputs.retrieve_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- force-app)" ]]; then
            echo "No retrieved metadata changes; no pull request is needed."
            exit 0
          fi
          branch="automation/org-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add force-app/
          git commit -m "chore: sync allowlisted metadata from Salesforce org"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Sync allowlisted metadata from Salesforce org" --body "Automated Salesforce metadata retrieval using $RETRIEVE_MANIFEST.

          Review the full diff carefully. This workflow never writes retrieved metadata directly to main."

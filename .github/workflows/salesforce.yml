name: Salesforce CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salesforce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Salesforce metadata and Apex
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Validate metadata deployment
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: |
          set -euo pipefail
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          chmod 600 "$RUNNER_TEMP/server.key"
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "$SF_USERNAME" \
            --instance-url "${SF_INSTANCE_URL:-https://login.salesforce.com}" \
            --alias housie-ci
          sf project deploy validate \
            --manifest manifest/package.xml \
            --target-org housie-ci \
            --test-level RunLocalTests \
            --wait 60

  deploy:
    name: Deploy to Salesforce
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Salesforce
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: |
          set -euo pipefail
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          chmod 600 "$RUNNER_TEMP/server.key"
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "$SF_USERNAME" \
            --instance-url "${SF_INSTANCE_URL:-https://login.salesforce.com}" \
            --alias housie-production

      - name: Deploy metadata
        run: sf project deploy start --manifest manifest/package.xml --target-org housie-production --test-level RunLocalTests --wait 60

      - name: Bootstrap Housie infrastructure
        run: sf apex run --target-org housie-production --file scripts/bootstrap.apex

      - name: Run Housie Apex tests
        run: sf apex run test --target-org housie-production --tests HousieDomainRulesTest --result-format human --wait 60

name: Salesforce PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'force-app/**'

permissions:
  contents: read

concurrency:
  group: salesforce-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application metadata and Apex
    runs-on: ubuntu-latest
    env:
      SF_TARGET_ORG_ALIAS: housie-dev
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check out trusted automation code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: .automation-runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate to Developer Edition
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: node .automation-runtime/packages/sf-augment/bin/login-with-jwt.js housie-dev
      - name: Validate application manifest and run local Apex tests
        run: node .automation-runtime/src/salesforce-deploy.mjs pr-validation

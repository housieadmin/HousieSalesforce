name: Salesforce PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: salesforce-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application metadata and Apex
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Developer Edition
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: |
          set -euo pipefail
          test -n "$SF_JWT_KEY" && test -n "$SF_CLIENT_ID" && test -n "$SF_USERNAME" && test -n "$SF_INSTANCE_URL"
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          chmod 600 "$RUNNER_TEMP/server.key"
          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file "$RUNNER_TEMP/server.key" --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias housie-dev

      - name: Validate candidate metadata and run local Apex tests
        run: sf project deploy start --dry-run --manifest manifest/package.xml --target-org housie-dev --test-level RunLocalTests --wait 60


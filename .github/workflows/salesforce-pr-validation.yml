name: Salesforce PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'force-app/**'

permissions:
  contents: read

concurrency:
  group: salesforce-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application metadata and Apex
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Salesforce CLI
        uses: ./.github/actions/setup-salesforce-cli

      - name: Authenticate to Developer Edition
        uses: ./.github/actions/salesforce-jwt-auth
        with:
          jwt_key: ${{ secrets.SF_JWT_KEY }}
          client_id: ${{ secrets.SF_CLIENT_ID }}
          username: ${{ secrets.SF_USERNAME }}
          instance_url: ${{ vars.SF_INSTANCE_URL }}
          alias: housie-dev

      - name: Validate application manifest without deployment
        run: sf project deploy start --dry-run --manifest manifest/package.xml --target-org housie-dev --test-level NoTestRun --wait 60

      - name: Run local Apex tests
        run: sf apex run test --target-org housie-dev --test-level RunLocalTests --result-format human --wait 60

name: Salesforce Deploy and Browser Verification

on:
  workflow_dispatch:
    inputs:
      source_ref: { description: Feature ref or commit, required: true, type: string }
      source_paths: { description: Newline-separated paths under force-app/, required: true, type: string }
      deployment_mode:
        description: Standard validates and runs selected tests; fast skips dry-run and Apex tests
        required: true
        type: choice
        default: standard
        options: [standard, fast]
      test_mode:
        description: Apex test mode (fast requires none)
        required: true
        type: choice
        default: none
        options: [none, specified, local]
      apex_test_classes: { required: false, type: string }
      scenarios_json: { description: JSON array of browser-agent scenario paths, required: true, type: string }
      run_description: { required: false, type: string }
      confirm_deployment: { description: Type DEPLOY, required: true, type: string }

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy selected metadata
    uses: ./.github/workflows/salesforce-ai-iteration-deploy.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      source_paths: ${{ inputs.source_paths }}
      deployment_mode: ${{ inputs.deployment_mode }}
      test_mode: ${{ inputs.test_mode }}
      apex_test_classes: ${{ inputs.apex_test_classes }}
      confirm_deployment: ${{ inputs.confirm_deployment }}
    secrets: inherit

  browser:
    name: Run browser scenarios after successful deployment
    needs: deploy
    uses: ./.github/workflows/browser-agent.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      scenarios_json: ${{ inputs.scenarios_json }}
      run_description: ${{ inputs.run_description }}
    secrets: inherit

  report:
    name: Post combined result
    if: always()
    needs: [deploy, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Comment combined result on issue 11
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const deploy = '${{ needs.deploy.result }}';
            const browser = '${{ needs.browser.result }}';
            const lines = ['**Salesforce deploy and browser verification finished.**', '- Workflow: ' + url, '- Deployment: ' + deploy, '- Browser verification: ' + browser, '- Source ref: `${{ inputs.source_ref }}`', '- Deployment mode: `${{ inputs.deployment_mode }}`', '- Browser evidence: download the artifact from this workflow run.'];
            if (deploy !== 'success') lines.push('Browser verification was skipped because deployment did not succeed.');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:11,body:lines.join('\n')});

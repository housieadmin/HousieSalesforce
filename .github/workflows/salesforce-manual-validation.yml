name: Salesforce Manual Validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch name or PR ref to validate
        required: true
        type: string
        default: main
      manifest_scope:
        description: Metadata manifest to validate
        required: true
        type: choice
        default: application
        options: [application, org-setup, experience, custom]
      custom_manifest:
        description: Required only for custom scope; path under manifest/ ending in .xml
        required: false
        type: string
      run_apex_tests:
        description: Run all local Apex tests after metadata validation
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: salesforce-manual-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate selected ref and manifest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MANIFEST_SCOPE: ${{ inputs.manifest_scope }}
      CUSTOM_MANIFEST: ${{ inputs.custom_manifest }}
      RUN_APEX_TESTS: ${{ inputs.run_apex_tests }}
      SF_TARGET_ORG_ALIAS: housie-dev
    steps:
      - name: Check out selected branch or pull request ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Check out trusted automation code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: .automation-runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate to Developer Edition
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
        run: node .automation-runtime/packages/sf-augment/bin/login-with-jwt.js housie-dev
      - name: Validate selected manifest and optionally run local Apex tests
        run: node .automation-runtime/src/salesforce-deploy.mjs manual-validation
